name: Claude Review

on:
  pull_request:
    # TEMP: synchronize（PR に push されたとき）を足して、直しの push もレビューする
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    # 下書き、外の人のコピーから来た PR、Dependabot の PR では動かさない
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # TEMP: 続けて push したとき、同じ PR の古いレビューを止めて、最新の分だけをレビューする。
    # job に置くと、下書きなどで job が飛ばされた実行は、動いているレビューを止めない
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # TEMP: push のたびに前と同じ指摘を繰り返さないよう、まとめにインラインの指摘の一覧を入れてもらい、次のレビューでそれを確かめる
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この PR の変更をレビューしてください。
            バグ、セキュリティ、壊れやすさなど、直す価値のある指摘だけを日本語で書いてください。
            行に結びつく指摘はインラインコメントにしてください。
            最後に `gh pr comment` で短いまとめを1つ投稿してください。まとめには、インラインで指摘したことの短い一覧も入れてください。問題がなければ、そのように短く書いてください。
            すでにレビューしたことのある PR なら、`gh pr view --comments` で前のまとめを確かめ、同じ指摘は繰り返さないでください。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Show Claude error
        if: failure()
        run: jq -r '.[] | select(.type == "result") | .result // "no result"' "$RUNNER_TEMP/claude-execution-output.json"

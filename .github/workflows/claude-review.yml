name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    # 下書き、外の人のコピーから来た PR、Dependabot の PR では動かさない
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この PR の変更をレビューしてください。
            バグ、セキュリティ、壊れやすさなど、直す価値のある指摘だけを日本語で書いてください。
            行に結びつく指摘はインラインコメントにしてください。
            最後に `gh pr comment` で短いまとめを1つ投稿してください。問題がなければ、そのように短く書いてください。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Show Claude error
        if: failure()
        run: jq -r '.[] | select(.type == "result") | .result // "no result"' "$RUNNER_TEMP/claude-execution-output.json"
